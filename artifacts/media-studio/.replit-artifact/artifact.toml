kind = "web"
previewPath = "/"
title = "AI Media Generation Studio"
description = "A full-stack creative workspace for generating short videos, images, music, and sound effects with project management, character references, generation queues, and expiring media history."
version = "1.0.0"
id = "artifacts/media-studio"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24893

[services.development]
run = "pnpm --filter @workspace/media-studio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/media-studio", "run", "build" ]
serve = "static"
publicDir = "artifacts/media-studio/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24893"
BASE_PATH = "/"
